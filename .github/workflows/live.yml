name: 🟢 Live Bot (24/7 slices)

# ─────────────────────────────────────────────────────────────────────────────
# ربات تلگرام، ۲۴ ساعته و بدونِ سرورِ اختصاصی.
#
# چرا «برش»: هیچ jobی در GitHub Actions بیشتر از ۶ ساعت زنده نمی‌ماند و اجرای
# طولانی هم غیرقابل‌اتکاست. پس ربات در برش‌های ۲۵ دقیقه‌ای اجرا می‌شود و هر
# برش خودش، پیش از رسیدنِ سقفِ زمان، تمیز خاموش می‌شود (`BOT_RUN_MINUTES`).
#
# چرا بدونِ وقفه است: cron هر ۲۰ دقیقه یک اجرا می‌سازد و هر اجرا ۲۵ دقیقه زنده
# است ⇒ هر برش ۵ دقیقه بیشتر از فاصلهٔ شروع‌ها عمر می‌کند. `concurrency` گروه
# `bot-live` تضمین می‌کند هیچ‌وقت دو ربات هم‌زمان poll نکنند: اجرای بعدی در صف
# می‌ماند و **همان لحظه‌ای که اجرای فعلی تمام شد** شروع می‌شود. نتیجه: پوششِ
# پیوسته، بدونِ بازهٔ خالی و بدونِ 409 Conflict.
#
# استقلال از cron: اجرای بعدی از قبل در صف ساخته شده، پس اگر یک برش پیش از
# موعد بمیرد (خطای شبکه، ری‌استارتِ runner) صف بلافاصله جای آن را می‌گیرد.
#
# بقیهٔ پروژه (استخراج، آبشار، Google Ready، انتشار داده) در `aggregate.yml`
# هر ~۱۵ دقیقه اجرا می‌شود؛ پنل‌ها و داشبوردها هم `index.json` را زنده
# می‌خوانند، پس با هر انتشار خودکار تازه می‌شوند. این workflow فقط یک کار
# دارد: زنده نگه‌داشتنِ ربات و ارسالِ بی‌وقفهٔ کانفیگ‌ها به کانال.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

# صفِ سریالی (نه هم‌زمان): هرگز دو نمونه با یک توکن poll نمی‌کنند.
concurrency:
  group: bot-live
  cancel-in-progress: false

permissions:
  contents: read
  actions: write      # برای repository_dispatch ساعتیِ ربات (aggregate)

env:
  BOT_RUN_MINUTES: "25"     # ۲۵ < ۲۰ + ۵ → هم‌پوشانیِ صف، نه هم‌پوشانیِ poll
  CHANNEL_PUBLISH: "live"   # ارسالِ واقعی به کانال
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  live:
    runs-on: ubuntu-latest
    # سقفِ سخت: ۲۵ دقیقه اجرا + نصبِ وابستگی‌ها. اگر این عدد از
    # BOT_RUN_MINUTES جدا نشود، یک برشِ گیرکرده کلِ job را می‌بلعد.
    timeout-minutes: 32
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐍 Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: 📦 Install bot dependencies
        run: pip install -r bot/requirements.txt

      - name: 📥 Pull runtime status
        # وضعیتِ چرخه‌ها و شمارنده‌ها را از شاخهٔ state می‌خواند تا داشبورد
        # پس از این برش عددهای واقعی داشته باشد. fail-open: نبودِ شبکه یا
        # شاخه نباید اجرای ربات را متوقف کند.
        run: python scripts/status.py pull || echo "::warning::status pull skipped"

      - name: 🔑 Check configuration
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "${BOT_TOKEN:-}" ]; then
            echo "::error title=BOT_TOKEN is not set::Settings → Secrets and variables → Actions → New repository secret → BOT_TOKEN (token from @BotFather)"
            exit 1
          fi
          echo "✅ BOT_TOKEN is present"

      - name: 🟢 Run bot (25 min slice)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -X utf8 -m bot.main

      - name: 📤 Publish runtime status
        if: always()
        continue-on-error: true
        run: |
          # «آفلاین» شدن پس از خاموشیِ تمیز: ربات در finally خودش offline
          # می‌کند؛ این گام همان وضعیت را روی شاخهٔ state می‌نشاند.
          python scripts/status.py publish || echo "::warning::status publish skipped"

      - name: 📊 Slice summary
        if: always()
        run: |
          echo "### 🟢 Live bot slice finished" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- scheduled life: \`${BOT_RUN_MINUTES}\` min" >> "$GITHUB_STEP_SUMMARY"
          echo "- next slice: queued by the concurrent \`bot-live\` group, starts immediately after this one ends" >> "$GITHUB_STEP_SUMMARY"
