<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>JoJo VPN — پنل گلس</title>
<link rel="icon" href="favicon.png">
<!--
  پنل گلس (Telegram Mini App) — تک‌فایل، بدون هیچ وابستگیِ خارجی.

  چرا داده‌ها از raw/CDN خوانده می‌شوند و نه از مسیر نسبی:
  این فایل در `docs/` است و GitHub Pages ریشه را روی `docs/` می‌گذارد، ولی
  `index.json` / `health.json` / `Countries/index.json` در **ریشهٔ مخزن** ساخته
  می‌شوند. پس `./index.json` روی Pages همیشه ۴۰۴ بود. آدرس‌ها مطلق‌اند
  (`raw.githubusercontent.com` اول، `cdn.jsdelivr.net` جایگزین) تا صفحه از هر
  origin و از هر زیرمسیر یکسان کار کند — همان قاعده‌ای که `docs/app.js` دارد.
  برای تست آفلاین/محلی: `?data=http://127.0.0.1:8123` (ریشه‌ای که index.json
  در آن است) و برای عوض‌کردن هندلِ ربات: `?bot=jojo_config_bot`.
-->
<style>
  :root{
    --bg1:#0b1020; --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12);
    --line:rgba(255,255,255,.16); --text:#eaf0ff; --muted:#9bb0d6;
    --accent:#4f9cff; --accent2:#8b5cff; --ok:#2ecc71; --warn:#f6c343; --bad:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(1200px 600px at 18% -10%,#1a2a4a 0%,#0b1020 62%),
      radial-gradient(900px 520px at 112% 108%,#1a3a6a 0%,transparent 60%);
    background-attachment:fixed; color:var(--text);
    padding:18px 14px calc(28px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
  }
  .glass{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line);
    border-radius:18px;box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
  header{display:flex;align-items:center;gap:12px;margin:2px 4px 14px}
  .logo{width:44px;height:44px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;
    font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px rgba(79,156,255,.35)}
  h1{font-size:17px;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:12px;margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px;margin-bottom:14px}
  .kpi{padding:11px 12px;border-radius:14px}
  .kpi b{display:block;font-size:19px;line-height:1.2;font-variant-numeric:tabular-nums}
  .kpi span{color:var(--muted);font-size:11px}

  nav{display:flex;gap:6px;overflow-x:auto;padding:3px;margin-bottom:12px;
    background:var(--glass);border:1px solid var(--line);border-radius:14px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;padding:8px 12px;border:0;border-radius:11px;background:transparent;
    color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  nav button[aria-selected="true"]{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600}
  section[hidden]{display:none}

  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:12px 14px;border-radius:14px;margin-bottom:8px}
  .row .t{font-size:13.5px;font-weight:600}
  .row .c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .row button,.btn{border:0;border-radius:11px;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;text-decoration:none;display:inline-block}
  .btn.ghost{background:var(--glass2);border:1px solid var(--line);color:var(--text)}
  .btn:active{transform:translateY(1px)}

  pre{white-space:pre-wrap;word-break:break-all;font:11.5px/1.65 ui-monospace,Consolas,monospace;
    background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    max-height:42vh;overflow:auto;color:#d6e2ff}
  .cfg{display:block;padding:6px 8px;border-radius:8px;cursor:pointer}
  .cfg:active{background:rgba(79,156,255,.18)}
  .hint{color:var(--muted);font-size:11.5px;margin:6px 2px 0;line-height:1.7}

  input[type=search]{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
    background:rgba(0,0,0,.22);color:var(--text);font:inherit;font-size:13px;margin-bottom:10px}
  input[type=search]::placeholder{color:#7f93b8}

  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:8px 6px;text-align:right;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:11px}
  .chip{padding:2px 7px;border-radius:8px;font-size:10.5px;background:rgba(46,204,113,.16);color:#7ee2a8}
  .chip.empty{background:rgba(246,195,67,.16);color:#f3d27a}
  .chip.fail{background:rgba(255,107,107,.16);color:#ffa8a8}
  .chip.disabled{background:rgba(255,255,255,.1);color:var(--muted)}

  details{padding:12px 14px;border-radius:14px;margin-bottom:8px}
  summary{cursor:pointer;font-size:13px;font-weight:600;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--muted)}
  details[open] summary::before{content:"▾ "}
  details .body{margin-top:10px}

  footer{margin-top:18px;text-align:center;color:var(--muted);font-size:11.5px;line-height:1.9}
  footer a{color:#9cc4ff;text-decoration:none}

  #fatal{margin-top:8px;padding:16px;border-radius:16px;border:1px solid rgba(255,107,107,.4);
    background:rgba(255,107,107,.08)}
  #fatal h2{font-size:14px;margin-bottom:6px}
  #fatal p{color:var(--muted);font-size:12.5px;line-height:1.8}
  .spinner{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.25);
    border-top-color:var(--accent);display:inline-block;animation:sp .8s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo">J</div>
  <div>
    <h1 id="title">پنل گلس</h1>
    <div class="sub">
      <span class="dot" id="healthDot"></span><span id="healthText">در حال خواندن…</span>
      <span id="brandText"></span>
    </div>
  </div>
</header>

<div class="kpis" id="kpis" aria-live="polite"></div>

<nav role="tablist" aria-label="بخش‌ها">
  <button role="tab" aria-selected="true"  data-tab="stats">📊 خلاصه</button>
  <button role="tab" aria-selected="false" data-tab="cats">📚 دسته‌ها</button>
  <button role="tab" aria-selected="false" data-tab="protos">⚙️ پروتکل‌ها</button>
  <button role="tab" aria-selected="false" data-tab="countries">🌍 کشورها</button>
  <button role="tab" aria-selected="false" data-tab="sources">📋 منابع</button>
  <button role="tab" aria-selected="false" data-tab="admin">🛡️ ادمین</button>
</nav>

<main>
  <section id="tab-stats">
    <div class="glass" style="padding:14px">
      <div id="statsBody" class="hint"><span class="spinner"></span> خواندن index.json…</div>
    </div>
    <!-- وضعیتِ واقعیِ سیستم: آنلاین‌بودنِ ربات، آخرین چرخه، صفِ ارسال.
         منبعش `status.json` روی شاخهٔ `state` است، نه «آخرین اجرای workflow». -->
    <div class="glass" style="padding:14px;margin-top:10px">
      <div id="sysBody" class="hint"><span class="spinner"></span> خواندن وضعیتِ اجرا…</div>
    </div>
  </section>
  <section id="tab-cats" hidden><div id="catsBody"></div></section>
  <section id="tab-protos" hidden><div id="protosBody"></div></section>
  <section id="tab-countries" hidden>
    <input type="search" id="countryFilter" placeholder="جست‌وجوی کشور…" autocomplete="off">
    <div id="countriesBody"></div>
  </section>
  <section id="tab-sources" hidden><div id="sourcesBody"><span class="spinner"></span></div></section>
  <section id="tab-admin" hidden><div id="adminBody"></div></section>
</main>

<div id="fatal" hidden>
  <h2>داده‌های مخزن در دسترس نیست</h2>
  <p id="fatalMsg"></p>
  <p style="margin-top:10px">
    <a class="btn" id="retry" href="javascript:void 0">تلاش دوباره</a>
    <a class="btn ghost" id="rawLink" target="_blank" rel="noopener noreferrer">index.json روی GitHub</a>
  </p>
</div>

<footer>
  <span id="footBrand">JoJo VPN</span> ·
  <a id="chanLink" target="_blank" rel="noopener noreferrer">کانال تلگرام</a> ·
  <a id="repoLink" target="_blank" rel="noopener noreferrer">مخزن</a>
  <div id="footMeta"></div>
</footer>

<script>
(function () {
  "use strict";

  var OWNER = "farshid78", REPO = "Free-v2ray-Configs", BRANCH = "main";
  // آیدیِ عددیِ مالک برای پنل ادمینِ مینی‌اپ. پیش‌فرض ۰ = پنل ادمین برای هیچ‌کس
  // نمایش داده نمی‌شود (امن). برای فعال‌سازی، مقدارِ OWNER_ID خود را اینجا بگذارید
  // یا از ?owner=<id> برای تست استفاده کنید (باید با همین مقدار برابر باشد).
  var OWNER_ID = 7351286060;

  function ownerOk() {
    if (!OWNER_ID) return false;
    var uid = 0;
    try {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) uid = tg.initDataUnsafe.user.id || 0;
    } catch (e) { uid = 0; }
    if (uid && uid === OWNER_ID) return true;
    var q = params.get("owner");
    if (q && Number(q) === OWNER_ID) return true;
    return false;
  }
  var RAW = "https://raw.githubusercontent.com/" + OWNER + "/" + REPO + "/" + BRANCH;
  var CDN = "https://cdn.jsdelivr.net/gh/" + OWNER + "/" + REPO + "@" + BRANCH;
  // وضعیتِ رانتایم روی شاخهٔ `state` منتشر می‌شود: شاخهٔ main با force-pushِ
  // انتشار بازنویسی می‌شود و هر فایلی بیرون از فهرستِ خروجی را پاک می‌کند.
  // تابع است (نه مقدارِ ثابت) چون DATA_ROOT پایین‌تر تعریف می‌شود.
  function statusBases() {
    return DATA_ROOT ? [DATA_ROOT]
      : ["https://raw.githubusercontent.com/" + OWNER + "/" + REPO + "/state",
         "https://cdn.jsdelivr.net/gh/" + OWNER + "/" + REPO + "@state"];
  }
  var REPO_URL = "https://github.com/" + OWNER + "/" + REPO;

  var params = new URLSearchParams(location.search);
  // ریشهٔ اختیاری داده (تست آفلاین: ?data=http://127.0.0.1:8123)
  var DATA_ROOT = (params.get("data") || "").replace(/\/+$/, "");
  // هندلِ ربات برای دکمه‌های ادمین. `@jojo_config_bot` هنوز در BotFather ساخته
  // نشده (getChat → «chat not found»)، پس به رباتِ زندهٔ همین مخزن اشاره می‌کنیم
  // تا هیچ دکمه‌ای به صفحهٔ مرده نرود. بعد از ساختِ آن هندل: ?bot=jojo_config_bot
  var BOT = (params.get("bot") || "jojo_np_bot").replace(/^@/, "");
  var CHANNEL = "jojo_config";

  var BASES = DATA_ROOT ? [DATA_ROOT] : [RAW, CDN];
  var TIMEOUT_MS = 15000;

  var state = { idx: null, health: null, countries: null };

  function $(id) { return document.getElementById(id); }
  function num(n) { return (typeof n === "number" && isFinite(n)) ? n.toLocaleString("en-US") : "—"; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // فقط http(s) — یک فیلدِ آلوده در داده نباید لینکِ javascript:/data: بسازد.
  // (http لازم است چون تستِ محلی داده را از 127.0.0.1 سرو می‌کند.)
  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\/[^\s"'<>]+$/.test(u) ? u : "";
  }

  function fetchWithTimeout(url, asJson) {
    var ctrl = typeof AbortController === "function" ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS) : null;
    var opts = { cache: "no-store", mode: "cors", credentials: "omit" };
    if (ctrl) opts.signal = ctrl.signal;
    var p = fetch(url, opts).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status + " · " + url);
      return asJson ? res.json() : res.text();
    });
    return p.then(function (body) {
      if (timer) clearTimeout(timer);
      return body;
    }, function (err) {
      if (timer) clearTimeout(timer);
      throw err;
    });
  }

  /** خواندن `path` از فهرستِ پایه‌ها به‌ترتیب، سپس آینه؛ خطا فقط وقتی همه شکست بخورند. */
  function getFrom(bases, path, asJson, bust) {
    var i = 0, lastErr = null;
    function attempt() {
      // `?t=`: لبهٔ raw تا ~۵ دقیقه کش می‌کند؛ برای وضعیتِ زنده لازم است.
      var url = bases[i] + "/" + path.replace(/^\/+/, "") + (bust ? "?t=" + Date.now() : "");
      return fetchWithTimeout(url, asJson).catch(function (err) {
        lastErr = err; i += 1;
        if (i < bases.length) return attempt();
        throw lastErr;
      });
    }
    return attempt();
  }

  function getFile(path, asJson) { return getFrom(BASES, path, asJson); }

  function ago(iso) {
    var t = Date.parse(iso || "");
    if (!t) return "—";
    var m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 1) return "همین حالا";
    if (m < 60) return m + " دقیقه پیش";
    var h = Math.round(m / 60);
    return h < 24 ? h + " ساعت پیش" : Math.round(h / 24) + " روز پیش";
  }

  /* ── مدلِ دسته‌ها: عددها همان چیزی است که pipeline در index.json می‌نویسد ── */
  function buckets() {
    var idx = state.idx || {}, cats = idx.categories || {}, cc = idx.cascade_categories || {};
    function fromCascade(key, label, icon) {
      var node = cc[key] || {}, files = node.files || {};
      return { key: key, label: label, icon: icon, count: node.unique,
               txt: files.configs_txt, b64: files.configs_base64,
               clash: files.clash_yaml, singbox: files.singbox_json, note: node.criterion };
    }
    var out = [
      fromCascade("verified", "Verified", "🏆"),
      fromCascade("fast", "Fast", "⚡"),
      fromCascade("secure", "Secure", "🔐"),
      fromCascade("google", "Google", "🟢")
    ];
    if (idx.top100) out.push({ key: "top100", label: "۱۰۰ برتر", icon: "🥇",
                               count: idx.top100.count, txt: idx.top100.url, note: idx.top100.criterion,
                               clash: null, singbox: null, b64: null });
    [["all", "همه", "🌐"], ["heavy", "Heavy", "📦"], ["light", "Light", "⭐"]].forEach(function (b) {
      var node = cats[b[0]] || {}, files = node.files || {};
      out.push({ key: b[0], label: b[1], icon: b[2], count: node.unique,
                 txt: files.configs_txt, b64: files.configs_base64,
                 clash: files.clash_yaml, singbox: files.singbox_json });
    });
    return out;
  }

  function allCount() {
    var c = (state.idx || {}).categories || {};
    return (c.all && c.all.unique) || 0;
  }

  /* ── رندر ──────────────────────────────────────────────────────────── */
  function renderHeader() {
    var idx = state.idx || {};
    $("logo").textContent = "J";
    // هندل با dir="ltr" تا در متنِ RTL به شکل «jojo_config@» برنگردد.
    $("title").innerHTML = 'پنل گلس · <span dir="ltr" style="unicode-bidi:isolate">' +
      esc(idx.brand || "JoJo VPN") + "</span>";
    var fresh = (idx.freshness && idx.freshness.cascade) || {};
    var stale = fresh.state && fresh.state !== "fresh";
    $("healthDot").className = "dot " + (stale ? "warn" : "ok");
    $("healthText").textContent = "به‌روزرسانی " + ago(idx.updated_at) +
      (idx.update_interval_minutes ? " · هر " + idx.update_interval_minutes + " دقیقه" : "");
    $("brandText").textContent = "";
    $("chanLink").href = "https://t.me/" + CHANNEL;
    $("repoLink").href = REPO_URL;
    $("rawLink").href = RAW + "/index.json";
    $("footMeta").textContent = (idx.updated_at ? "آخرین داده: " + idx.updated_at.replace("T", " ").slice(0, 19) + " UTC" : "");
  }

  function renderKpis() {
    var idx = state.idx || {}, h = state.health || {}, s = h.summary || {};
    var cc = idx.cascade_categories || {}, c = idx.categories || {};
    var items = [
      ["کل کانفیگ", (c.all && c.all.unique)],
      ["Verified", (cc.verified && cc.verified.unique)],
      ["۱۰۰ برتر", (idx.top100 && idx.top100.count)],
      ["کشورها", (idx.countries && idx.countries.count)],
      ["منابع سالم", s.ok != null ? s.ok + "/" + s.total : (idx.sources && idx.sources.healthy)],
      ["زمان اجرا", idx.elapsed_seconds != null ? idx.elapsed_seconds + "s" : null]
    ];
    $("kpis").innerHTML = items.map(function (it) {
      return '<div class="glass kpi"><b>' + (typeof it[1] === "number" ? num(it[1]) : esc(it[1] || "—")) +
             "</b><span>" + esc(it[0]) + "</span></div>";
    }).join("");
  }

  function renderStats() {
    var idx = state.idx || {}, p = idx.protocols || {};
    var rows = Object.keys(p).filter(function (k) { return p[k] > 0; })
      .sort(function (a, b) { return p[b] - p[a]; })
      .map(function (k) {
        return '<div class="row glass"><span class="t">' + esc(k) + '</span>' +
               '<span class="c">' + num(p[k]) + "</span></div>";
      }).join("");
    var dup = (idx.categories && idx.categories.all && idx.categories.all.duplicates);
    var fetched = (idx.categories && idx.categories.all && idx.categories.all.total_fetched);
    $("statsBody").innerHTML =
      '<div class="hint" style="margin:0 2px 10px">پروتکل‌ها در کلِ استخر (dedup)</div>' + rows +
      '<div class="hint">در این اجرا ' + num(fetched) + " خط خوانده شد؛ " + num(dup) +
      " تکراری حذف شد و " + num(allCount()) + " کانفیگِ یکتا ماند.</div>";
  }

  /** بخشِ «وضعیتِ سیستم» — همین چیزی که داشبورد باید نشان دهد، نه «سبزِ آخرین run». */
  function renderSystem() {
    var s = state.sys;
    var box = $("sysBody");
    if (!s) {
      box.innerHTML = '<div class="hint">وضعیتِ اجرا هنوز منتشر نشده است (شاخهٔ <code>state</code> خالی است).</div>';
      return;
    }
    var bot = s.bot || {}, cyc = s.cycle || {}, c = s.counts || {};
    var stages = cyc.stages || {}, wfs = s.workflows || {};
    function dot(ok) { return ok ? "🟢" : "🔴"; }
    function hbText(sec) {
      if (sec == null) return "بدونِ heartbeat";
      if (sec < 120) return sec + " ثانیه پیش";
      if (sec < 7200) return Math.round(sec / 60) + " دقیقه پیش";
      return Math.round(sec / 3600) + " ساعت پیش";
    }
    var rows = [];
    rows.push(["ربات تلگرام", dot(bot.online) + (bot.online ? " آنلاین" : " آفلاین"),
               "heartbeat: " + hbText(bot.heartbeat_age_s)]);
    rows.push(["آخرین چرخه", cyc.ok === true ? "✅ موفق" : (cyc.ok === false ? "❌ ناموفق" : "—"),
               (cyc.finished_at ? ago(cyc.finished_at) : "—") +
               (cyc.duration_s ? " · " + Math.round(cyc.duration_s) + " ثانیه" : "") +
               (cyc.error ? " · " + cyc.error : "")]);
    rows.push(["آخرین استخراج", stages.collection ? (stages.collection.status === "ok" ? "✅" : "⚠️") : "—",
               (stages.collection && stages.collection.at ? ago(stages.collection.at) : "—") +
               (stages.collection && stages.collection.detail ? " · " + stages.collection.detail : "")]);
    rows.push(["کانفیگ‌ها", num(c.collected), "خوانده‌شده در این چرخه"]);
    rows.push(["معتبر / نامعتبر", num(c.verified) + " / " + num(c.invalid), "verified در برابر broken"]);
    rows.push(["تکراری", num(c.duplicate), "حذف‌شده در dedup"]);
    rows.push(["ارسال به کانال", num(c.sent) + " موفق", num(c.send_failed) + " تلاشِ ناموفق · " + num(c.queued) + " در صف"]);
    Object.keys(wfs).forEach(function (name) {
      var w = wfs[name] || {};
      rows.push(["workflow «" + name + "»", dot(w.last_ok) + (w.last_ok ? " آخرین اجرا موفق" : " آخرین اجرا ناموفق"),
                 (w.last_run_at ? ago(w.last_run_at) : "—") +
                 (w.duration_s ? " · " + Math.round(w.duration_s) + " ثانیه" : "") +
                 (w.error ? " · " + w.error : "")]);
    });
    var stageKeys = Object.keys(stages);
    var stageHtml = stageKeys.length ? ('<div class="hint" style="margin-top:8px">مراحل: ' +
      stageKeys.map(function (k) {
        var v = stages[k] || {};
        var icon = v.status === "ok" ? "✅" : (v.status === "skipped" ? "⏭️" : "❌");
        return icon + " " + esc(k);
      }).join(" · ") + "</div>") : "";
    // کهنگی: اگر وضعیت بیش از ۲۰ دقیقه به‌روز نشده باشد، عددها قابلِ اتکا نیستند.
    var ageMin = (function () { var t = Date.parse(s.updated_at || ""); return t ? (Date.now() - t) / 60000 : null; })();
    var stale = ageMin != null && ageMin > 20;
    box.innerHTML = rows.map(function (r) {
      return '<div class="row glass"><span class="t">' + esc(r[0]) + '</span>' +
             '<span class="c" style="font-size:12px;text-align:left">' + esc(r[1]) +
             (r[2] ? '<br><span class="hint">' + esc(r[2]) + "</span>" : "") + "</span></div>";
    }).join("") + stageHtml +
    '<div class="hint" style="margin-top:8px">' +
      (stale ? "⚠️ وضعیت " + ago(s.updated_at) + " به‌روز نشده — عددها ممکن است کهنه باشند."
             : "وضعیت " + ago(s.updated_at) + " به‌روز شد") + "</div>";
  }

  function loadStatus() {
    getFrom(statusBases(), "status.json", true, true).then(function (data) {
      state.sys = data;
      renderSystem();
    }).catch(function () {
      state.sys = null;
      renderSystem();
    });
  }

  function previewBlock(id, lines, total, label) {
    var head = '<div class="hint" style="margin:0 2px 8px">' + esc(label) + " — " +
      num(lines.length) + " از " + num(total) + " مورد (روی هر خط بزنید تا کپی شود)</div>";
    var body = '<pre id="' + id + '">' + lines.map(function (l) {
      return '<span class="cfg" data-copy="' + esc(l) + '">' + esc(l) + "</span>";
    }).join("\n") + "</pre>";
    return head + body;
  }

  function wireCopy(root) {
    root.addEventListener("click", function (ev) {
      var el = ev.target.closest("[data-copy]");
      if (!el) return;
      var text = el.getAttribute("data-copy");
      var done = function () {
        var old = el.textContent;
        el.textContent = "✓ کپی شد";
        setTimeout(function () { el.textContent = old; }, 900);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () {});
      } else {
        var ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); done(); } catch (e) {}
        document.body.removeChild(ta);
      }
    });
  }

  function renderCats() {
    var list = buckets();
    $("catsBody").innerHTML = list.map(function (b, i) {
      var txt = safeUrl(b.txt), b64 = safeUrl(b.b64);
      var clash = safeUrl(b.clash), sing = safeUrl(b.singbox);
      // لینک‌های ساب‌سکریپشن (کپی‌پذیر) — هر فرمت یک دکمهٔ کپی + یک لینکِ بازکردن
      var links = [];
      if (b64) links.push(['base64', b64]);
      if (txt) links.push(['plain', txt]);
      if (clash) links.push(['clash', clash]);
      if (sing) links.push(['sing-box', sing]);
      var linksHtml = links.map(function (lk) {
        return '<button class="btn ghost" data-copy="' + esc(lk[1]) + '" title="کپی">' + esc(lk[0]) + ' · کپی</button>' +
               '<a class="btn ghost" target="_blank" rel="noopener noreferrer" href="' + lk[1] + '" title="باز کردن">↗</a>';
      }).join(' ');
      return '<div class="glass" style="padding:12px 14px;border-radius:14px;margin-bottom:8px">' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<span style="font-size:16px">' + b.icon + "</span>" +
          '<span class="t" style="flex:1">' + esc(b.label) + "</span>" +
          '<span class="c">' + num(b.count) + " کانفیگ</span>" +
        "</div>" +
        '<div class="hint" style="margin:6px 2px 4px">لینک‌های ساب‌سکریپشن (برای کپی، روی دکمه بزنید):</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">' + (linksHtml || '<span class="hint">لینکی ثبت نشده.</span>') + "</div>" +
        '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
          '<button class="btn" data-preview="' + i + '">پیش‌نمایش ۱۰ مورد</button>' +
        "</div>" +
        '<div id="prev-' + i + '"></div>' +
      "</div>";
    }).join("");

    $("catsBody").addEventListener("click", function (ev) {
      var btn = ev.target.closest("[data-preview]");
      if (!btn) return;
      var b = list[Number(btn.getAttribute("data-preview"))];
      var box = $("prev-" + btn.getAttribute("data-preview"));
      if (!safeUrl(b.txt)) { box.innerHTML = '<div class="hint">فایلی برای این دسته ثبت نشده.</div>'; return; }
      box.innerHTML = '<div class="hint"><span class="spinner"></span> خواندن ' + esc(b.label) + "…</div>";
      fetchWithTimeout(safeUrl(b.txt), false).then(function (text) {
        var lines = text.split(/\r?\n/).filter(function (l) { return l.trim() && l.charAt(0) !== "#"; });
        box.innerHTML = previewBlock("cfg-" + b.key, lines.slice(0, 10), b.count || lines.length, b.label);
      }).catch(function (err) {
        box.innerHTML = '<div class="hint">خواندن نشد (' + esc(err.message) +
          ') — «فایل کامل» را مستقیم باز کنید.</div>';
      });
    });
    wireCopy($("catsBody"));
  }

  function renderProtos() {
    var idx = state.idx || {}, p = idx.protocols || {}, f = idx.protocol_files || {};
    var keys = Object.keys(p).filter(function (k) { return p[k] > 0; })
      .sort(function (a, b) { return p[b] - p[a]; });
    $("protosBody").innerHTML = keys.map(function (k) {
      var url = safeUrl(f[k]);
      return '<div class="glass" style="padding:12px 14px;border-radius:14px;margin-bottom:8px">' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<span class="t" style="flex:1">' + esc(k) + "</span>" +
          '<span class="c">' + num(p[k]) + "</span></div>" +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">' +
          (url ? '<button class="btn" data-purl="' + esc(url) + '" data-pname="' + esc(k) + '">پیش‌نمایش ۱۰ مورد</button>' +
                 '<a class="btn ghost" target="_blank" rel="noopener noreferrer" href="' + url + '">فایل کامل</a>'
               : '<span class="hint">فایلی ثبت نشده.</span>') +
        "</div><div id=\"prev-p-" + esc(k) + '"></div></div>';
    }).join("");

    $("protosBody").addEventListener("click", function (ev) {
      var btn = ev.target.closest("[data-purl]");
      if (!btn) return;
      var box = $("prev-p-" + btn.getAttribute("data-pname"));
      box.innerHTML = '<div class="hint"><span class="spinner"></span> خواندن…</div>';
      fetchWithTimeout(btn.getAttribute("data-purl"), false).then(function (text) {
        var lines = text.split(/\r?\n/).filter(function (l) { return l.trim() && l.charAt(0) !== "#"; });
        box.innerHTML = previewBlock("cfg-p", lines.slice(0, 10), lines.length, btn.getAttribute("data-pname"));
      }).catch(function (err) {
        box.innerHTML = '<div class="hint">خواندن نشد (' + esc(err.message) + ").</div>";
      });
    });
    wireCopy($("protosBody"));
  }

  function renderCountries() {
    var list = (state.countries && state.countries.countries) || [];
    var q = ($("countryFilter").value || "").trim().toLowerCase();
    var shown = list.filter(function (c) {
      return !q || (c.name || "").toLowerCase().indexOf(q) >= 0 ||
             (c.code || "").toLowerCase().indexOf(q) >= 0;
    });
    $("countriesBody").innerHTML = shown.length ? shown.map(function (c) {
      var url = safeUrl(BASES[0] + "/" + c.file);
      return '<div class="glass" style="padding:11px 14px;border-radius:14px;margin-bottom:7px">' +
        '<div style="display:flex;align-items:center;gap:9px">' +
          "<span>" + esc(c.flag || "🏳️") + "</span>" +
          '<span class="t" style="flex:1">' + esc(c.name) + ' <span class="c">' + esc(c.code) + "</span></span>" +
          '<span class="c">' + num(c.count) + "</span>" +
          (url ? '<button class="btn" data-curl="' + esc(url) + '" data-cname="' + esc(c.code || c.name) + '">نمایش</button>' : "") +
        "</div><div id=\"prev-c-" + esc(c.code || "") + '"></div></div>';
    }).join("") : '<div class="hint">کشوری با این نام پیدا نشد.</div>';

    if (!$("countriesBody").dataset.wired) {
      $("countriesBody").dataset.wired = "1";
      $("countriesBody").addEventListener("click", function (ev) {
        var btn = ev.target.closest("[data-curl]");
        if (!btn) return;
        var box = $("prev-c-" + btn.getAttribute("data-cname"));
        box.innerHTML = '<div class="hint"><span class="spinner"></span> خواندن…</div>';
        fetchWithTimeout(btn.getAttribute("data-curl"), false).then(function (text) {
          var lines = text.split(/\r?\n/).filter(function (l) { return l.trim() && l.charAt(0) !== "#"; });
          box.innerHTML = previewBlock("cfg-c", lines.slice(0, 10), lines.length, btn.getAttribute("data-cname"));
        }).catch(function (err) {
          box.innerHTML = '<div class="hint">خواندن نشد (' + esc(err.message) + ").</div>";
        });
      });
      wireCopy($("countriesBody"));
    }
  }

  function renderSources() {
    var h = state.health || {}, s = h.summary || {}, rows = h.sources || [];
    if (!rows.length) { $("sourcesBody").innerHTML = '<div class="hint">health.json در دسترس نیست.</div>'; return; }
    var body = rows.map(function (r) {
      var cls = r.status === "ok" ? "" : (r.status === "empty" ? " empty" : (r.status === "fail" ? " fail" : " disabled"));
      return "<tr><td>" + esc(r.name) + '<div class="c">' + esc(r.tier) + "</div></td>" +
        '<td><span class="chip' + cls + '">' + esc(r.status) + "</span></td>" +
        '<td class="c">' + num(r.count) + "</td>" +
        '<td class="c">' + (r.latency_ms != null ? r.latency_ms + "ms" : "—") + "</td></tr>";
    }).join("");
    $("sourcesBody").innerHTML =
      '<div class="glass" style="padding:12px 14px;border-radius:14px">' +
      '<div class="hint" style="margin:0 0 8px">' + num(s.ok) + " سالم از " + num(s.total) +
      " منبع · " + num(s.disabled) + " خاموش" +
      (h.checked_at ? " · " + ago(h.checked_at) : "") + "</div>" +
      "<table><thead><tr><th>منبع</th><th>وضعیت</th><th>کانفیگ</th><th>تأخیر</th></tr></thead><tbody>" +
      body + "</tbody></table></div>" +
      '<div class="hint">افزودن/خاموش‌کردن منبع و اجرای دستیِ تجمیع از پنل ادمینِ ربات انجام می‌شود ' +
      '(دکمهٔ «📋 منابع»). این صفحه فقط‌خواندنی است.</div>';
  }

  function renderAdmin() {
    if (!ownerOk()) { $("adminBody").innerHTML = '<div class="hint">دسترسی ندارید — این بخش فقط برای مالک (OWNER_ID) است.</div>'; return; }
    var idx = state.idx || {}, h = state.health || {}, s = h.summary || {};
    var cards = [
      ["📊 آمار پروژه", num(allCount()) + " کانفیگ · " + num(idx.countries && idx.countries.count) + " کشور", "stats"],
      ["📋 منابع و آنالیز", num(s.ok) + " سالم از " + num(s.total) + " منبع", "sources"],
      ["🔄 اجرای تجمیع", "Trigger aggregate-now از ربات", "bot"],
      ["📢 Broadcast", "ارسال پیام به کاربرانِ ربات", "bot"],
      ["➕ افزودن منبع", "URL منبع را در ربات بفرستید", "bot"],
      ["🛡️ افزودن/حذف ادمین", "فقط مالک (OWNER_ID)", "bot"]
    ];
    $("adminBody").innerHTML = cards.map(function (c) {
      var action = c[2] === "bot"
        ? '<a class="btn" target="_blank" rel="noopener noreferrer" href="https://t.me/' + esc(BOT) + '">در ربات</a>'
        : '<button class="btn ghost" data-goto="' + c[2] + '">باز کردن</button>';
      return '<div class="glass" style="padding:12px 14px;border-radius:14px;margin-bottom:8px">' +
        '<div style="display:flex;align-items:center;gap:10px">' +
          '<div style="flex:1"><div class="t">' + esc(c[0]) + '</div><div class="c">' + esc(c[1]) + "</div></div>" +
          action + "</div></div>";
    }).join("") +
      '<div class="hint">اقداماتِ نوشتاری (اجرا، broadcast، منابع، ادمین) به‌خاطرِ امنیت فقط در ربات انجام می‌شوند؛ ' +
      "این پنل همان آمار و منابعِ واقعی را نشان می‌دهد و شما را به رباتِ زنده وصل می‌کند.</div>";

    $("adminBody").addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-goto]");
      if (b) selectTab(b.getAttribute("data-goto"));
    });
  }

  function selectTab(name) {
    if (name === "admin" && !ownerOk()) return;
    document.querySelectorAll("nav button").forEach(function (b) {
      b.setAttribute("aria-selected", String(b.getAttribute("data-tab") === name));
    });
    ["stats", "cats", "protos", "countries", "sources", "admin"].forEach(function (t) {
      if (t === "admin" && !ownerOk()) { $("tab-" + t).hidden = true; return; }
      $("tab-" + t).hidden = t !== name;
    });
    if (name === "countries" && !state.countries) loadCountries();
  }

  function fatal(err) {
    $("fatal").hidden = false;
    $("fatalMsg").textContent = "همهٔ مسیرها امتحان شدند (raw و آینهٔ jsDelivr). آخرین خطا: " +
      (err && err.message ? err.message : "نامشخص") + ". اتصال شبکه یا فیلترِ ISP را بررسی کنید.";
    $("statsBody").innerHTML = '<span class="hint">داده خوانده نشد.</span>';
    $("healthDot").className = "dot bad";
    $("healthText").textContent = "بدون داده";
  }

  function loadCountries() {
    $("countriesBody").innerHTML = '<div class="hint"><span class="spinner"></span> خواندن Countries/index.json…</div>';
    getFile("Countries/index.json", true).then(function (data) {
      state.countries = data;
      renderCountries();
    }).catch(function (err) {
      $("countriesBody").innerHTML = '<div class="hint">فهرست کشورها خوانده نشد (' + esc(err.message) +
        ') — از ربات (فیلتر کشور) استفاده کنید.</div>';
    });
  }

  function boot() {
    // پنل ادمین فقط برای مالک (ownerOk). کاربران عادی دکمه و تب را نمی‌بینند.
    if (!ownerOk()) {
      var adminBtn = document.querySelector('nav button[data-tab="admin"]');
      if (adminBtn) adminBtn.style.display = "none";
      var adminTab = $("tab-admin");
      if (adminTab) adminTab.hidden = true;
    }
    $("kpis").innerHTML = '<div class="glass kpi"><b>…</b><span>در حال بارگذاری</span></div>';
    // وضعیتِ سیستم مستقل از index.json بارگذاری می‌شود؛ خرابیِ یکی نباید
    // اطلاعاتِ دیگری را پنهان کند.
    loadStatus();
    getFile("index.json", true).then(function (idx) {
      state.idx = idx;
      renderHeader(); renderKpis(); renderStats(); renderCats(); renderProtos(); renderAdmin();
      selectTab("stats");
      return getFile("health.json", true).then(function (h) {
        state.health = h;
        renderKpis(); renderSources(); renderAdmin();
      }).catch(function () { renderSources(); });
    }).catch(function (err) {
      fatal(err);
    });
  }

  document.querySelectorAll("nav button").forEach(function (b) {
    b.addEventListener("click", function () { selectTab(b.getAttribute("data-tab")); });
  });
  $("countryFilter").addEventListener("input", function () { renderCountries(); });
  $("retry").addEventListener("click", function (ev) {
    ev.preventDefault();
    $("fatal").hidden = true;
    boot();
  });

  boot();
})();
</script>
</body>
</html>
